{{define "title"}}Reset Password - ExpenseTrace{{end}}
{{define "css"}}/static/css/pages/auth.css{{end}}

{{define "main"}}
  <div class="auth-container">
    <div class="auth-card card">
      <img src="/static/logo.png" alt="ExpenseTrace Logo" class="auth-logo">

      <h1>Reset your password</h1>
      <h2>Enter a new password for your account</h2>

      {{if gt (len .Error) 0}}
        {{template "error" .Error}}
      {{end}}

      <form method="POST" action="/reset-password" class="auth-form">
        <input type="hidden" name="token" value="{{.Token}}">

        <div class="form-group">
          <label for="password">New Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter new password"
            required
            autofocus>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm New Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm new password"
            required>
        </div>

        <button type="submit" class="btn-primary">Reset Password</button>
      </form>

      <p class="auth-link">
        <a href="/signin">Back to sign in</a>
      </p>
    </div>
  </div>
{{end}}
