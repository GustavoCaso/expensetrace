{{define "reports/card" }}
  <div id="report">
    <h2 class="ledger-title">{{.Title}} Summary</h2>
    <section class="ledger-totals report-totals" aria-label="Totals">
      <div class="ledger-total">
        <span class="ledger-total-label">Income</span>
        <span class="ledger-total-value income">{{formatMoney .Income "." ","}}€</span>
      </div>
      <div class="ledger-total">
        <span class="ledger-total-label">Spending</span>
        <span class="ledger-total-value expense">{{formatMoney .Spending "." ","}}€</span>
      </div>
      <div class="ledger-total">
        <span class="ledger-total-label">Savings</span>
        <span class="ledger-total-value {{if gt .Savings 0}}income{{else}}expense{{end}}">{{formatMoney .Savings "." ","}}€</span>
        <span class="ledger-total-note {{if gt .Savings 0}}income{{else}}expense{{end}}">{{printf "%.1f%%" .SavingsPercentage}} of income</span>
      </div>
    </section>

    {{template "reports/categories" .}}
  </div>
{{end}}
